{% extends 'base.html' %}
{% block content %}<h2>Perfil</h2>
<p>Usuario: {{ user.username }}</p>
<p>Email: {{ user.email }}</p>
{% if user.profile.avatar %}<img src="{{ user.profile.avatar.url }}" width="100">{% endif %}
<p>Bio: {{ user.profile.bio|safe }}</p>
<p>Birthday: {{ user.profile.birthday }}</p>
<a href="{% url 'edit_profile' %}">Editar Perfil</a>
{% endblock %}
